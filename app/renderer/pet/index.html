<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>桌宠</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      user-select: none; cursor: default;
    }
    #stage { position: absolute; inset: 0; }
    #fxCanvas { position: absolute; inset: 0; pointer-events: none; }
    #charStack {
      position: absolute; left: 50%; bottom: 90px;
      transform: translateX(-50%);
      width: 340px; height: 453px; /* 600x800 按比例缩放 */
    }
    #charStack .layer {
      position: absolute; inset: 0;
      background-size: 100% 100%; background-repeat: no-repeat;
      pointer-events: none;
    }
    #charStack.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="fxCanvas"></canvas>
    <div id="charStack">
      <div id="poseImg" class="layer"></div>
      <div id="gazeImg" class="layer"></div>
      <div id="blinkImg" class="layer"></div>
      <div id="mouthImg" class="layer"></div>
    </div>
  </div>
  <script src="./bundle.js"></script>
</body>
</html>
